# Local database for development: `docker compose up -d`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bingo
    ports:
      - '5432:5432'
    volumes:
      - bingo-db:/var/lib/postgresql/data
volumes:
  bingo-db:
