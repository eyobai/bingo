<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#2a1a5e"/><stop offset="1" stop-color="#0b1120"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".55" stop-color="#f6b93b"/><stop offset="1" stop-color="#b9780a"/></linearGradient>
    <radialGradient id="bl" cx="38%" cy="30%" r="80%"><stop offset="0" stop-color="#7fb0ff"/><stop offset="1" stop-color="#1d4fbf"/></radialGradient>
    <radialGradient id="gr" cx="38%" cy="30%" r="80%"><stop offset="0" stop-color="#7ee8a2"/><stop offset="1" stop-color="#15803d"/></radialGradient>
    <radialGradient id="rd" cx="38%" cy="30%" r="80%"><stop offset="0" stop-color="#ff8f8f"/><stop offset="1" stop-color="#b91c1c"/></radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- dice -->
  <g transform="translate(150 150) rotate(-14)">
    <rect x="-46" y="-46" width="92" height="92" rx="18" fill="#ffffff"/>
    <circle cx="-22" cy="-22" r="9" fill="#b91c1c"/><circle cx="0" cy="0" r="9" fill="#b91c1c"/><circle cx="22" cy="22" r="9" fill="#b91c1c"/>
  </g>
  <!-- bingo ball -->
  <circle cx="362" cy="140" r="52" fill="url(#bl)"/><circle cx="362" cy="140" r="27" fill="#fff"/>
  <text x="362" y="152" text-anchor="middle" font-family="Inter Display" font-weight="900" font-size="32" fill="#1d4fbf">7</text>
  <!-- card suit chip -->
  <circle cx="256" cy="108" r="38" fill="url(#gr)"/><circle cx="256" cy="108" r="26" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="8 7"/>
  <text x="256" y="356" text-anchor="middle" font-family="Inter Display" font-weight="900" font-size="146" fill="url(#gold)">LEYU</text>
  <text x="256" y="420" text-anchor="middle" font-family="Inter Display" font-weight="900" font-size="46" letter-spacing="16" fill="#ffffff">GAMES</text>
  <circle cx="256" cy="462" r="7" fill="url(#rd)"/><circle cx="226" cy="462" r="5" fill="#f6b93b"/><circle cx="286" cy="462" r="5" fill="#f6b93b"/>
</svg>
